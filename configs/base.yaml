img_size: 512
img_channels: 3
data_dir: data
clean_scans_dir: data/clean_scans
backgrounds_dir: data/backgrounds
real_photos_dir: data/real_photos
raw_photos_dir: data/real_photos/raw
reference_scans_dir: data/real_photos/reference_scans
annotations_file: data/real_photos/annotations/CV Doc-Enhancement Real Test Set.v1i.coco/train/_annotations.coco.json
splits_file: data/splits/splits.json
frozen_dir: data/frozen
runs_dir: runs
train_ratio: 0.8
val_ratio: 0.1
test_ratio: 0.1
split_seed: 42
frozen_seed: 123
enhance_lr: 0.001
enhance_epochs: 100
enhance_samples_per_epoch: 2000
loss_weights:
  l1: 1.0
  ssim: 0.5
  edge: 0.1
corner_lr: 0.001
corner_epochs: 100
corner_samples_per_epoch: 2000
heatmap_sigma: 8.0
warp_range:
- 0.03
- 0.35
downscale_range:
- 1.5
- 3.5
brightness_range:
- -40.0
- 40.0
contrast_range:
- 0.55
- 1.5
color_cast_r_range:
- 0.75
- 1.25
color_cast_b_range:
- 0.75
- 1.25
blur_sigmas:
- 0.5
- 2.0
noise_sigmas:
- 3.0
- 22.0
jpeg_qualities:
- 30
- 85
generator:
  canvas: 512
  geometry:
    area_fraction:
    - 0.15
    - 0.95
    rotation_deg:
    - -25.0
    - 25.0
    perspective_strength:
    - 0.0
    - 0.35
    aspect_jitter:
    - -0.15
    - 0.15
    min_interior_angle_deg: 20.0
  resolution_loss:
    scale_factor:
    - 1.5
    - 3.5
    probability: 0.6
  photometric:
    contrast:
    - 0.55
    - 1.5
    brightness:
    - -40.0
    - 40.0
    channel_gain:
    - 0.75
    - 1.25
    probability: 0.8
  illumination:
    gradient_range:
    - 0.65
    - 1.1
    shadow_count:
    - 0
    - 2
    shadow_opacity:
    - 0.1
    - 0.4
    shadow_blur:
    - 15
    - 91
    shadow_probability: 0.4
    probability: 0.7
  sensor:
    blur_kernel:
    - 3
    - 7
    blur_sigma:
    - 0.5
    - 2.0
    motion_blur_prob: 0.25
    noise_sigma:
    - 3.0
    - 22.0
    darkness_scaled_noise: true
    probability: 0.7
  compression:
    jpeg_quality:
    - 30
    - 85
    probability: 0.7
  hard_negatives:
    distractor_count:
    - 0
    - 0
  debug:
    photometrics_off: false
seed: 42
data:
  # ADR-009: standardise the model input with the training-split statistics below;
  # the target, the output and every metric stay in [0, 1].
  standardize: true
normalization:
  mean:
  - 0.8282
  - 0.8387
  - 0.8255
  std:
  - 0.1443
  - 0.1239
  - 0.146

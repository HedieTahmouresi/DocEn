run:
  experiment_id: exp-001
  name: enh_mse
  seed: 1337
  notes: "L-A variant: MSE loss"

model:
  arch: unet
  base_channels: 64
  levels: 4
  out_channels: 3
  upsample: transpose
  dropout: 0.0

data:
  resolution: 512
  samples_per_epoch: 4000
  batch_size: 16
  frozen_version: v1

loss:
  type: mse

optim:
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 0.0
  scheduler: cosine
  epochs: 60
  grad_clip: 1.0

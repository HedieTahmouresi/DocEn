run:
  experiment_id: exp-003
  name: enh_l1msssim
  seed: 1337
  notes: "L-C variant: L1 + MS-SSIM (alpha=0.84)"

model:
  arch: unet
  base_channels: 64
  levels: 4
  out_channels: 3
  upsample: transpose
  dropout: 0.0

data:
  resolution: 512
  samples_per_epoch: 4000
  batch_size: 16
  frozen_version: v1

loss:
  type: l1_msssim
  alpha: 0.84

optim:
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 0.0
  scheduler: cosine
  epochs: 60
  grad_clip: 1.0

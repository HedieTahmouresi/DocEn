run:
  experiment_id: exp-006
  name: enh_l1
  seed: 1337
  notes: "L-B variant: L1 loss"

model:
  arch: unet
  base_channels: 64
  levels: 4
  out_channels: 3
  upsample: transpose
  dropout: 0.0

data:
  resolution: 512
  samples_per_epoch: 2000
  # batch_size lives in configs/env/*.yaml: it is a VRAM property, not an
  # experiment property. All four ablation runs must use the same profile.
  frozen_version: v1

loss:
  type: l1

optim:
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 0.0
  scheduler: cosine
  epochs: 40
  grad_clip: 1.0

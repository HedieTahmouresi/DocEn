run:
  experiment_id: exp-009
  name: corner_approach_a
  seed: 1337
  notes: "Approach A: Direct coordinate regression via CornerRegNet (L1 loss on [0,1] coordinates)"

model:
  arch: corner_reg
  base_channels: 64
  levels: 4
  out_channels: 8
  dropout: 0.0

data:
  resolution: 512
  samples_per_epoch: 2000
  frozen_version: v1

loss:
  type: l1

optim:
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 0.0
  scheduler: cosine
  epochs: 40
  grad_clip: 1.0
